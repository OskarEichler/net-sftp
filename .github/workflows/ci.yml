name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.flaky }}
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.1", "3.2", "3.3", "3.4", "4.0"]
        flaky: [false]
        include:
          - ruby-version: "ruby-head"
            flaky: true
          - ruby-version: "jruby-9.4"
            flaky: true
          - ruby-version: "jruby-head"
            flaky: true
          - ruby-version: "truffleruby"
            flaky: true
          - ruby-version: "truffleruby-head"
            flaky: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run Tests
        run: bundle exec rake test

      # Ruby 4 does not freeze string literals by default, so exercise the
      # forward-compatible behaviour explicitly.
      - name: Run Tests (frozen string literals)
        run: bundle exec rake test
        env:
          RUBYOPT: "--enable-frozen-string-literal"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Audit dependencies
        run: bundle exec bundle-audit check --update
